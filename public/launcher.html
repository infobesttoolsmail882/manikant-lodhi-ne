<!DOCTYPE html>
<html>
<head>
  <title>Secure Mail Console</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>📧 Secure Mail Console</h2>

    <div class="row">
      <input id="senderName" placeholder="Sender Name">
      <input id="gmail" placeholder="Your Gmail">
    </div>

    <div class="row">
      <input id="appPassword" placeholder="App Password" type="password">
      <input id="subject" placeholder="Email Subject">
    </div>

    <div class="row">
      <textarea id="message" placeholder="Message Body"></textarea>
      <textarea id="recipients" placeholder="Recipients (comma / new line)"></textarea>
    </div>

    <div class="row">
      <button onclick="sendEmails()">Send All</button>
      <button onclick="logout()">Logout</button>
    </div>

    <p id="status"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
