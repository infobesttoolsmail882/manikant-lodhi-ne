<!DOCTYPE html>
<html>
<head>
  <title>Mail Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="card">
    <h2 class="title">📨 Mail Panel</h2>

    <div class="form-grid">
      <input id="senderName" placeholder="Sender Name">
      <input id="email" placeholder="Your Gmail">
      <input id="password" type="password" placeholder="App Password">
      <input id="recipient" placeholder="Recipient Email">
      <input id="subject" placeholder="Subject">
      <textarea id="message" placeholder="Message"></textarea>
    </div>

    <div class="btn-row">
      <button id="sendBtn">Send</button>
      <button onclick="logout()">Logout</button>
    </div>

    <p id="status"></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
