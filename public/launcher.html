<!DOCTYPE html>
<html>
<head>
  <title>Mail Dispatch Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="card">
    <h2 class="title">📨 Mail Dispatch Panel</h2>

    <div class="form-grid">
      <!-- Row 1 -->
      <input id="senderName" placeholder="Sender Name">
      <input id="gmail" placeholder="Gmail">

      <!-- Row 2 -->
      <input id="apppass" type="password" placeholder="App Password">
      <input id="subject" placeholder="Subject">

      <!-- Row 3 -->
      <textarea id="message" placeholder="Message"></textarea>
      <textarea id="to" placeholder="Recipients"></textarea>
    </div>

    <div class="btn-row">
      <button id="sendBtn">Send</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>
</div>

<div id="popup" class="popup hidden">
  <div class="popup-box">
    <p id="popupText"></p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
