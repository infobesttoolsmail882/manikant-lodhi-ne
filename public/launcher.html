<!DOCTYPE html>
<html>
<head>
  <title>Mail Console</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="card">
    <h2 class="title">📧 Mail Console</h2>

    <div class="form-grid">
      <input id="subject" placeholder="Email Subject">
      <textarea id="message" placeholder="Message Body"></textarea>
      <textarea id="to" placeholder="Recipient Email"></textarea>
    </div>

    <div class="btn-row">
      <button id="sendBtn">Send</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
