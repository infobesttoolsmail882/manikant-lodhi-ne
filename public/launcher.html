<!DOCTYPE html>
<html>
<head>
  <title>Secure Mail Console</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Secure Mail Console</h2>

    <div class="row">
      <input id="senderName" placeholder="Sender Name">
      <input id="gmail" placeholder="Your Gmail">
    </div>

    <div class="row">
      <input id="appPassword" type="password" placeholder="App Password">
      <input id="subject" placeholder="Email Subject">
    </div>

    <div class="row">
      <textarea id="message" class="big"></textarea>
      <textarea id="recipients"></textarea>
    </div>

    <div class="row">
      <button id="sendBtn" onclick="sendEmails()">Send All</button>
      <button ondblclick="logout()">Logout</button>
    </div>

    <p id="status"></p>
  </div>

<script src="script.js"></script>
</body>
</html>
