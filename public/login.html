<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container small">
    <h2>Login</h2>
    <input type="password" id="pass" placeholder="Enter Access Password">
    <button onclick="login()">Login</button>
    <p id="msg"></p>
  </div>

  <script>
    function login() {
      if (document.getElementById("pass").value === "admin123") {
        window.location = "launcher.html";
      } else {
        document.getElementById("msg").innerText = "Wrong password";
      }
    }
  </script>
</body>
</html>
