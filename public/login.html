<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-box">
    <h2>Secure Login</h2>
    <input type="password" id="pass" placeholder="Access Code">
    <button onclick="login()">Login</button>
    <p id="msg"></p>
  </div>

<script>
function login() {
  if (pass.value === "@#882") {
    window.location = "launcher.html";
  } else {
    msg.innerText = "Wrong password";
  }
}
</script>
</body>
</html>
